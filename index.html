<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next B3A</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Microsoft JhengHei", sans-serif; margin: 0;
         background: #f4f6f8; color: #1f2933; }
  header { background: #c00000; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 28px; }
  header p { margin: 4px 0 0; opacity: .9; }
  main { display: flex; flex-wrap: wrap; gap: 20px; padding: 24px; }
  section { flex: 1 1 320px; background: #fff; border-radius: 12px; padding: 18px 22px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  h2 { margin: 0 0 4px; font-size: 20px; color: #1f4e79; }
  .stop { color: #6b7280; margin: 0 0 14px; }
  .bus { display: flex; justify-content: space-between; align-items: baseline;
         border-top: 1px solid #e5e7eb; padding: 10px 0; }
  .min { font-size: 34px; font-weight: 700; color: #c00000; }
  .clock { color: #6b7280; }
  .none { color: #6b7280; padding: 10px 0; }
  footer { padding: 0 24px 24px; color: #6b7280; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Next B3A</h1>
  <p>Citybus · Lingnan ⇄ Shenzhen Bay Port · 城巴 B3A</p>
</header>
<main>
  <section>
    <h2>To Shenzhen Bay Port · 往深圳灣口岸</h2>
    <p class="stop">From Fu Tai Estate, Castle Peak Road · 富泰邨</p>
    <div id="out">Loading…</div>
  </section>
  <section>
    <h2>To Tuen Mun · 往屯門山景邨</h2>
    <p class="stop">From Shenzhen Bay Port · 深圳灣口岸</p>
    <div id="in">Loading…</div>
  </section>
</main>
<footer>Data: Citybus real-time ETA, DATA.GOV.HK · updated <span id="updated">–</span> · refreshes every 30 s</footer>
<script>
  // Stop IDs come from /route-stop/CTB/B3A/outbound and /stop/{id}:
  // 003261 = Fu Tai Estate (outbound, last stop before the port)
  // 003208 = Shenzhen Bay Port (inbound, first stop)
  const API = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/";
  const BOARDS = [["out", "003261", "O"], ["in", "003208", "I"]];

  async function load(boxId, stop, dir) {
    const box = document.getElementById(boxId);
    try {
      const res = await fetch(API + stop + "/B3A");
      const data = (await res.json()).data.filter(b => b.dir === dir && b.eta);
      if (data.length === 0) {
        box.innerHTML = '<div class="none">No bus in the next hour · 暫時沒有班次</div>';
        return;
      }
      box.innerHTML = data.map(b => {
        const t = new Date(b.eta);
        const min = Math.max(0, Math.round((t - Date.now()) / 60000));
        const clock = t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit",
                                                      timeZone: "Asia/Hong_Kong" });
        const note = b.rmk_en ? " · " + b.rmk_en : "";
        return `<div class="bus"><span class="min">${min === 0 ? "Arriving" : min + " min"}</span>` +
               `<span class="clock">${clock}${note}</span></div>`;
      }).join("");
    } catch (e) {
      box.innerHTML = '<div class="none">Cannot reach the data. Check the Wi-Fi.</div>';
    }
  }

  function refresh() {
    BOARDS.forEach(b => load(...b));
    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Hong_Kong" });
  }
  refresh();
  setInterval(refresh, 30000);
</script>
</body>
</html>
